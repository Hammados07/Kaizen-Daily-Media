name: Back up NASA EONET natural events
# Every six hours, saves a copy of EONET's open events so Rimi Lab Cosmos has something to show when EONET is busy.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/eonet-fetch.mjs
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          git diff --cached --quiet || git commit -m "EONET backup $(date -u +%FT%H:%MZ)"
          git pull --rebase -q && git push
