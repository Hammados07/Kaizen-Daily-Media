name: Publish to Instagram
# Every 30 minutes, posts anything in queue/ig/ that is due. Uses the IG_TOKEN secret only.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: check (show the account), dry (make a Reel container from video_url, never publish) or publish
        default: check
      video_url:
        description: for dry, a public mp4 link
        default: ''
permissions:
  contents: write
concurrency: { group: instagram, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ig-publish.mjs ${{ github.event.inputs.mode || 'publish' }} "${{ github.event.inputs.video_url }}"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Save the queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || { git commit -m "Instagram queue $(date -u +%FT%H:%MZ)"; git pull --rebase -q; git push; }
