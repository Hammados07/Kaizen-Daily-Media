name: Peek at a page
on:
  workflow_dispatch:
    inputs:
      url: { description: Page, required: true }
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0" "${{ github.event.inputs.url }}" -o page.html
          wc -c page.html
          python3 - <<'PY'
          import re
          h=open('page.html',encoding='utf8',errors='ignore').read()
          for i,m in enumerate(re.finditer(r'<p[^>]*>(.{40,400}?)</p>', h, re.S)):
              t=re.sub(r'<[^>]+>','',m.group(1)).replace('\n',' ')[:300]
              cls=re.search(r'<p([^>]*)>', m.group(0)).group(1)[:80]
              if i<10: print(f'::notice title=p{i}::{cls} || {t}')
          for k in ['og:description','name="description"','Explanation','wp-block']:
              j=h.find(k); print(f'::notice title={k[:12]}::{j} '+re.sub(r'\s+',' ',h[max(0,j-150):j+250]).replace('<','[').replace('>',']')[:380])
          PY
