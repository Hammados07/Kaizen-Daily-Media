name: Back up GDACS disaster alerts
# Every six hours, saves a copy of GDACS alerts so Rimi Lab Cosmos has something to show when GDACS does not answer it.
on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/gdacs-fetch.mjs
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          git diff --cached --quiet || git commit -m "GDACS backup $(date -u +%FT%H:%MZ)"
          git pull --rebase -q && git push
