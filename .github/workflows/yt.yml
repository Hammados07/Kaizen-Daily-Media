name: Publish to YouTube
# Rimi Lab Publisher. Watches the queue and uploads anything in queue/yt/ that is due to our own channel.
# Uses the YT_CLIENT_ID, YT_CLIENT_SECRET and YT_REFRESH_TOKEN secrets only.
on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: check (sign in only), test (private upload of file) or publish
        default: check
      file:
        description: for test, a repo path to an mp4
        default: ''
      privacy:
        description: for test, private or unlisted
        default: private
permissions:
  contents: write
  actions: write
# The queue watcher runs one at a time; manual checks and tests use their own lane so they never wait behind it.
concurrency: { group: "youtube-${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'publish') && 'publish' || 'manual' }}", cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Install ffmpeg (for the end card)
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
      - name: Run once (manual check, test or dry)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'publish'
        run: node scripts/yt-upload.mjs ${{ github.event.inputs.mode || 'publish' }} "${{ github.event.inputs.file }}" "${{ github.event.inputs.privacy }}"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Watch the queue and publish on time
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/watch-queue.sh queue/yt videoId YouTube yt.yml -- node scripts/yt-upload.mjs publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - name: Save the queue
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || { git commit -m "YouTube queue $(date -u +%FT%H:%MZ)"; for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done; }
