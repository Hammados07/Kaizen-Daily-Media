name: Publish to YouTube
# Rimi Lab Publisher. Every 30 minutes, uploads anything in queue/yt/ that is due to our own channel.
# Uses the YT_CLIENT_ID, YT_CLIENT_SECRET and YT_REFRESH_TOKEN secrets only.
on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: check (sign in only), test (private upload of file) or publish
        default: check
      file:
        description: for test, a repo path to an mp4
        default: ''
permissions:
  contents: write
concurrency: { group: youtube, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/yt-upload.mjs ${{ github.event.inputs.mode || 'publish' }} "${{ github.event.inputs.file }}"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Save the queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || { git commit -m "YouTube queue $(date -u +%FT%H:%MZ)"; git pull --rebase -q; git push; }
