name: Save a NASA library picture
on:
  workflow_dispatch:
    inputs:
      items:
        description: NASA ids or search words, separated by |
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/nasa-image.mjs "${{ github.event.inputs.items }}"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pick
          git diff --cached --quiet && exit 0
          git commit -m "NASA library pictures"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
